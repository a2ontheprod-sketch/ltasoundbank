name: Build LTA Soundbank VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out files
        uses: actions/checkout@v4
      - name: Configure project
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target LTA_Soundbank_VST3 --parallel 2
      - name: Package complete VST3 directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Get-ChildItem -Path 'build' -Directory -Recurse -Filter 'LTA Soundbank.vst3' | Where-Object { $_.FullName -match '[\\/]VST3[\\/]' } | Select-Object -First 1
          if ($null -eq $bundle) { throw 'LTA Soundbank.vst3 not found' }
          New-Item -ItemType Directory -Path 'package' -Force | Out-Null
          Copy-Item -LiteralPath $bundle.FullName -Destination 'package' -Recurse -Force
          Compress-Archive -Path 'package/*' -DestinationPath 'LTA_SOUNDBANK_Windows_VST3.zip' -Force
      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: LTA-SOUNDBANK-Windows-VST3
          path: LTA_SOUNDBANK_Windows_VST3.zip
          if-no-files-found: error
